# ============================================================
# RATING MANUAL — single source of truth. rater/price.py reads this;
# docs/RATING_MANUAL.md is rendered from it (python -m analysis.render_manual).
# Every number is tagged:  [E] estimated from data   [S] selected (judgment)
#                          [B] benchmark-anchored     VERIFY = re-derive from live data
# ============================================================
meta:
  version: "0.1.0"
  currency: USD
  base_limit_csl: 1000000          # [B] shipper/broker standard; 49 CFR 387.9 min is 750k
  exposure_base: power_unit_year
  effective: "2026-09-01"

# ---- Loss-cost anchors (per power-unit-year, base segment) ------------------
# Base segment: for-hire, 2-5 units, authority 3+ yrs, dry van, radius 51-200,
# neutral venue state, average OOS, no crashes, drivers == units.
loss_cost:
  # [E] 2026-09-09 (was 0.0625 [S/B]): census x crash file, base segment 2-5 units / authority 3y+, measured 0.0363
  # (SE 0.0002, 30,775 crashes) grossed up by 1/0.802 for recordable crash rows with no DOT -> 0.0452.
  # docs/FREQUENCY_PROPOSAL_2026-09-09.md section 1. Range = measured floor .. grossed-up + reporting-lag allowance.
  crash_rate_per_unit_year: 0.045
  crash_rate_range: [0.036, 0.055]
  # [S] 2026-09-09 (was 1.20): liability claims per DOT-recordable crash (adds non-recordable third-party claims, removes
  # not-at-fault). Only crash_rate x this ratio is identified: backing claim frequency out of the 2025-26 market price
  # points (docs/MARKET_BENCHMARK.md, 65% permissible / 1.14 ALAE / limited severity / relativity) gives 1.2-3.4 claims
  # per crash, median 2.3, and industry combined ratios above 100% make that a floor. 2.0 holds the base loss cost
  # within 1.4% of the pre-change value ($4,269 vs $4,328). VERIFY against bound-book claims-per-crash from month one.
  crash_to_claim_ratio: 2.0
  # claim frequency = crash_rate x crash_to_claim_ratio  (= 0.090 at defaults)
  severity:                                 # ground-up mixture; limited mean computed numerically in rater/losscost.py
    # [E] shares 2026-09-09 (were 0.735 / 0.250 / 0.015 [S/B]): crash file gives fatal 2.7% and injury 34% of recordable
    # crashes in the base segment; per CLAIM = share / crash_to_claim_ratio, assuming the extra non-recordable claims
    # are property-damage-only. Means, CVs, threshold and alpha unchanged [S/B].
    pdo:    {share: 0.8165, dist: lognormal, mean: 18000,   cv: 1.2}
    injury: {share: 0.170,  dist: lognormal, mean: 140000,  cv: 2.5}
    fatal:  {share: 0.0135, dist: pareto,    threshold: 250000, alpha: 1.6}
  # [B] 2026-09-09 (was 0.08): ATRI as reported in trade press - serious-case settlements +5.7% p.a., median nuclear
  # verdict +50% 2013-2022 (~4.6% p.a.), liability premium trend +3.9% (2025) / +6.4% (Q1-2026). 6% sits inside that band;
  # 8% was above every published series. VERIFY the settlement and verdict figures against the ATRI PDFs (SOURCES S12).
  severity_trend_annual: 0.06
  trend_years: 1.5

credibility:
  k_unit_years: 25            # [S] Z = n/(n+k)
  history_years: 2
  own_rate_cap_multiple: 3.0

relativities:
  total_cap: {min: 0.60, max: 3.25}
  # [S] 2026-09-09: authority x venue x radius compounded to 2.75 on a first-year TX long-hauler ($20.9k vs a published
  # $8-20k band, docs/MARKET_BENCHMARK.md P5). Cap the product of these three before the other factors apply.
  stack_cap: {factors: [authority_age, venue_state, radius], max: 2.0}
  # [S] 2026-09-09: mileage intensity and long-haul radius proxy the same exposure and fired together on 4 of 10
  # benchmark profiles (P1, P3, P5, P10). Skip the mileage band when radius is already long haul.
  mileage_intensity_skip_radii: [long_haul_500_plus]
  authority_age_years:
    - {max: 1,   factor: 1.65}
    - {max: 3,   factor: 1.25}
    - {max: 99,  factor: 1.00}
  fleet_size_units:
    - {max: 1,   factor: 0.95}
    - {max: 5,   factor: 1.00}
  radius_miles:
    local_0_50: 0.80
    intermediate_51_200: 1.00
    regional_201_500: 1.15
    long_haul_500_plus: 1.30
  commodity:
    dry_van: 1.00
    reefer: 1.05
    flatbed: 1.10
    general_freight: 1.00
    building_materials: 1.10
    machinery_heavy: 1.15
    grain_feed: 1.00
    logs_lumber: 1.20
    intermodal: 1.05
    unknown: 1.10
  venue_state:
    high:   {factor: 1.35, states: [LA, GA, FL, TX, CA, IL, NY, NJ, PA, MO, NV, WA]}
    medium: {factor: 1.12, states: [AL, MS, SC, NM, OK, AZ, MD, MI, OR, MN]}
    low:    {factor: 0.90, states: [IA, NE, KS, ND, SD, WI, ID, UT, WY, MT, IN, KY, TN, VA, NC, OH]}
  driver_unit_ratio:
    - {max: 0.99, factor: 0.90}
    - {max: 1.20, factor: 1.00}
    - {max: 2.00, factor: 1.10}
    - {max: 99,   factor: 1.25}
  driver_experience_years_min:
    - {max: 2,  factor: 1.30}
    - {max: 5,  factor: 1.10}
    - {max: 99, factor: 1.00}
  vehicle_age_years_avg:
    - {max: 5,  factor: 0.95}
    - {max: 12, factor: 1.00}
    - {max: 20, factor: 1.10}
    - {max: 99, factor: 1.20}
  oos_ratio_to_segment_avg:
    min_inspections: 3
    driver:
      - {max: 0.5, factor: 0.95}
      - {max: 1.5, factor: 1.00}
      - {max: 3.0, factor: 1.15}
      - {max: 99,  factor: 1.30}
    vehicle:
      - {max: 0.5, factor: 0.95}
      - {max: 1.5, factor: 1.00}
      - {max: 3.0, factor: 1.10}
      - {max: 99,  factor: 1.20}
  # DORMANT on live data (2026-09-09): QCMobile returns basicsPercentile "Not Public" for property carriers (53 of 53
  # live-enriched carriers; FAST Act 2015), so these bands and rule D24 only fire from a percentile supplied some other way
  # (PSP / carrier-submitted SMS login). The API does return measureValue and basicsViolationThreshold per BASIC; a
  # measure-based band is the replacement. The 2025-26 SMS overhaul also renamed BASICs to "compliance categories",
  # folded controlled substances into unsafe driving and split vehicle maintenance (SOURCES.md S7, unconfirmed).
  basic_percentile:
    unsafe_driving: [{max: 50, factor: 1.00}, {max: 65, factor: 1.10}, {max: 100, factor: 1.30}]
    hos_compliance: [{max: 50, factor: 1.00}, {max: 65, factor: 1.08}, {max: 100, factor: 1.20}]
    vehicle_maintenance: [{max: 50, factor: 1.00}, {max: 80, factor: 1.05}, {max: 100, factor: 1.12}]
    driver_fitness: [{max: 50, factor: 1.00}, {max: 80, factor: 1.03}, {max: 100, factor: 1.08}]
    controlled_substances: [{max: 50, factor: 1.00}, {max: 80, factor: 1.10}, {max: 100, factor: 1.30}]
  mcs150_stale_years:
    - {max: 2,  factor: 1.00}
    - {max: 99, factor: 1.08}
  # [S] MCS-150 mileage per unit below this is a placeholder (1, 2, 30 miles seen on 6 of 45 real carriers) -> treated as unknown, factor 1.00
  mileage_min_plausible_per_unit: 5000
  mileage_intensity:
    - {max: 30000,  factor: 0.90}
    - {max: 90000,  factor: 1.00}
    - {max: 140000, factor: 1.08}
    - {max: 9000000000, factor: 1.15}

loadings:
  alae_ratio: 0.14
  expense_ratio: 0.22
  reinsurance_ratio: 0.06
  profit_cost_of_capital: 0.07
  minimum_premium_per_unit: 8000   # [B] 2026-09-09: was 6500; every 2025-26 source puts clean established one-truck liability at >= $7,500 (docs/MARKET_BENCHMARK.md P1, P6, P9, DAT)
  policy_fee: 250

limits:
  offered: [750000, 1000000, 2000000]

segment_averages:
  driver_oos_rate: 0.062
  vehicle_oos_rate: 0.215
