# Decline / refer rules. Any DECLINE wins; else any REFER -> refer; else PRICE.
# Conditions evaluate over the feature dict built in rater/features.py. Missing field => condition is False.
rules:
  - {id: D01, action: decline, reason: "USDOT not found / no carrier record", when: {field: carrier_found, op: eq, value: false}}
  - {id: D02, action: decline, reason: "Not allowed to operate (OOS order / revocation)", when: {field: allowed_to_operate, op: eq, value: false}}
  - {id: D03, action: decline, reason: "Federal out-of-service order in force", when: {field: oos_order, op: eq, value: true}}
  - {id: D04, action: decline, reason: "Safety rating Unsatisfactory", when: {field: safety_rating, op: in, value: [UNSATISFACTORY]}}
  - {id: D05, action: decline, reason: "USDOT registration inactive (statusCode != A)", when: {field: usdot_status_active, op: eq, value: false}}
  - {id: D10, action: decline, reason: "Power units outside 1-5", when: {field: power_units, op: not_between, value: [1, 5]}}
  - {id: D11, action: decline, reason: "Hazmat / tanker / passenger / HHG / auto-hauler out of appetite", when: {field: out_of_appetite_commodity, op: eq, value: true}}
  - {id: D12, action: decline, reason: "Not a for-hire interstate carrier", when: {field: for_hire_interstate, op: eq, value: false}}
  # D20 tests own_crash_rate_ratio (UNCAPPED own rate / segment rate), not cred_rate_relativity. The old threshold
  # was cred_rate_relativity > 3.0, which cannot occur: the relativity caps the own rate at 3x and then credibility-
  # weights it, so its maximum is 1 + 2Z = 1.148 at one unit and 1.571 at five. The rule was dead for every carrier
  # in the 1-5 unit appetite, and a 2-unit carrier with 12 crashes in 24 months priced clean at the floor. The gate
  # on the raw count keeps a single crash on a one-truck fleet (ratio 11x on 2 unit-years) out of the decline path:
  # that is mostly noise at Z = 0.07 and is handled by price alone. 3+ crashes AND 4x segment is not noise here.
  - {id: D20, action: decline, reason: "Own crash rate > 4x segment on 3+ crashes in 24 months", when: {all: [{field: own_crash_rate_ratio, op: gt, value: 4.0}, {field: crashes_24m, op: gte, value: 3}]}}
  - {id: D21, action: decline, reason: "Fatal crash in window with >=1 other crash", when: {all: [{field: fatal_crashes, op: gte, value: 1}, {field: crashes_24m, op: gte, value: 2}]}}
  # Enforcing limits.offered. Previously any submitted limit bound through the limited mean of the severity mixture.
  # D32 is deliberately narrow: only a limit BELOW the federal minimum (cannot legally write it) or ABOVE the top
  # limit we offer (a layer we do not rate). A limit that is merely off the grid - $900k, or $1,000,001, which is a
  # typo rather than a request - refers on R13 instead. Declining an otherwise good submission over a stray digit
  # is the wrong answer to "sensible handling of missing or bad inputs".
  - {id: D32, action: decline, reason: "Limit below the federal minimum or above the top limit offered (750k-2m CSL)", when: {field: limit_outside_writable_range, op: eq, value: true}}
  - {id: D22, action: decline, reason: "Driver OOS rate > 3x segment avg with >= 5 inspections", when: {all: [{field: driver_oos_ratio, op: gt, value: 3.0}, {field: driver_inspections, op: gte, value: 5}]}}
  - {id: D23, action: decline, reason: "Insurance cancelled / coverage gap in last 24 months", when: {field: insurance_cancellation_24m, op: eq, value: true}}
  # DORMANT on live data: QCMobile returns basicsPercentile "Not Public" for property carriers (53 of 53 enriched), so
  # basic_unsafe_driving is only set from a fixture or a percentile supplied another way (PSP / carrier SMS login).
  - {id: D24, action: decline, reason: "Unsafe Driving BASIC >= 90th percentile", when: {field: basic_unsafe_driving, op: gte, value: 90}}
  # Every R07 refer in the 45-carrier real sample had bipdInsuranceOnFile = 0. Authority status N (never granted) with no
  # filing is a pending applicant - they cannot get authority until an insurer files the BMC-91, so that is what a
  # legitimate prospect looks like at quote time (R07 refers it). Status I (granted, later made inactive) with no filing
  # is a lapsed/revoked authority: the FMCSA revokes for insurance lapse, and the carrier cannot legally run today.
  - {id: D25, action: decline, reason: "MC authority inactive (previously granted) and no BI/PD filing on record", when: {all: [{field: bipd_insurance_on_file_k, op: lte, value: 0}, {any: [{field: common_authority_status, op: eq, value: I}, {field: contract_authority_status, op: eq, value: I}]}]}}
  - {id: D30, action: decline, reason: "Submitted VINs decode to non-commercial vehicles", when: {field: non_commercial_vin_share, op: gt, value: 0.5}}
  - {id: D31, action: decline, reason: "Declared units differ from census by >3 or >2x", when: {field: unit_count_mismatch, op: eq, value: true}}
  - {id: R01, action: refer, reason: "Authority < 6 months and no inspection history", when: {all: [{field: authority_age_years, op: lt, value: 0.5}, {field: total_inspections, op: eq, value: 0}]}}
  - {id: R02, action: refer, reason: "Enrichment degraded - priced on segment defaults", when: {field: enrichment_degraded, op: eq, value: true}}
  - {id: R03, action: refer, reason: "Safety rating Conditional", when: {field: safety_rating, op: in, value: [CONDITIONAL]}}
  - {id: R04, action: refer, reason: "MCS-150 not updated in > 2 years", when: {field: mcs150_age_years, op: gt, value: 2}}
  - {id: R05, action: refer, reason: "Zero drivers declared", when: {field: drivers, op: lte, value: 0}}
  # STUB / DORMANT: rater/features.py sets chameleon_flag = False unconditionally. Firing it needs an index of the
  # physical address and phone of every revoked carrier in the census file, matched against this carrier's own
  # address within three years before its add date. That index is not built, so this rule never fires today.
  - {id: R06, action: refer, reason: "Chameleon signal: shared address/phone with revoked carrier", when: {field: chameleon_flag, op: eq, value: true}}
  - {id: R07, action: refer, reason: "No active common/contract for-hire authority on file", when: {field: active_for_hire_authority, op: eq, value: false}}
  - {id: R08, action: refer, reason: "DOT absent from FMCSA census snapshot (new registration or inactive)", when: {field: in_census, op: eq, value: false}}
  - {id: R09, action: refer, reason: "QCMobile has no operation classification yet (registration too new) - for-hire status unverified", when: {field: operation_classification_known, op: eq, value: false}}
  # Adverse own crash experience short of the D20 decline. The count gate is 2, not 1, on purpose: 16 of the 18
  # carriers with any crash across the 113 real / holdout / operating carriers have exactly ONE, and at Z = 0.07
  # on a one-truck fleet the model's own position is that a single crash is mostly noise (RATIONALE section 4).
  # Gating at 1 made R10 the most-fired rule in the book and took the holdout refer rate to 50%, which is a worse
  # answer than the problem it was fixing. A single crash is now handled by price alone - and it is no longer free,
  # because the minimum premium scales with the experience relativity (loadings.minimum_premium_experience_scaled).
  # A SECOND crash inside 24 months on a 1-5 unit fleet is not noise, and that is what a human should see.
  - {id: R10, action: refer, reason: "Two or more crashes in 24 months at > 3x segment rate", when: {all: [{field: own_crash_rate_ratio, op: gt, value: 3.0}, {field: crashes_24m, op: gte, value: 2}]}}
  # A fatality with no second crash is not D21, but it is never a clean automatic price at this fleet size.
  - {id: R11, action: refer, reason: "Fatal crash in the 24-month window", when: {field: fatal_crashes, op: gte, value: 1}}
  # $2m is offered but the severity tail is not calibrated for it: ILF(2m) = 1.058 against market 1.3-1.5
  # (RATIONALE section 6, gap G13). Refer for manual excess pricing rather than bind a known-thin ILF.
  - {id: R12, action: refer, reason: "Limit above $1m base - ILF thin at 2m, price the excess manually", when: {field: limit_excess_layer, op: eq, value: true}}
  # Inside the writable band but not one of the three limits we quote: almost always a data-entry error. Priced at
  # the limit submitted (the limited mean handles any limit) and put in front of a human to confirm what they meant.
  - {id: R13, action: refer, reason: "Limit is not one of the offered values - confirm the limit requested", when: {field: limit_off_grid, op: eq, value: true}}
